name: GreenCloud Optimizer CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: greencloud

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d greencloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:

      # ---------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # 2. Set up Python
      # ---------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ---------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ---------------------------------------------------
      # 4. Configure test environment
      # ---------------------------------------------------

      - name: Configure environment
        run: |
          echo "APP_NAME=GreenCloud Optimizer" >> $GITHUB_ENV
          echo "APP_VERSION=1.0.0" >> $GITHUB_ENV
          echo "DEBUG=false" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/greencloud" >> $GITHUB_ENV
          echo "OPENROUTER_API_KEY=test-key" >> $GITHUB_ENV
          echo "OPENROUTER_BASE_URL=https://openrouter.ai/api/v1" >> $GITHUB_ENV
          echo "LLM_MODEL=openai/gpt-5-mini" >> $GITHUB_ENV
          echo "EMBEDDING_MODEL=openai/text-embedding-3-small" >> $GITHUB_ENV


      # ---------------------------------------------------
      # 5. Enable PostgreSQL vector extension
      # ---------------------------------------------------

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d greencloud \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"


      # ---------------------------------------------------
      # 6. Run database migrations
      # ---------------------------------------------------

      - name: Run Alembic migrations
        run: |
          alembic upgrade head


      # ---------------------------------------------------
      # 7. Run automated tests
      # ---------------------------------------------------

      - name: Run tests
        run: |
          pytest -v