services:

  # -------------------------------------------------------
  # PostgreSQL + pgvector
  # -------------------------------------------------------

  postgres:
    image: pgvector/pgvector:pg16
    container_name: greencloud-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: greencloud

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greencloud"]
      interval: 5s
      timeout: 5s
      retries: 5


  # -------------------------------------------------------
  # FastAPI application
  # -------------------------------------------------------

  api:
    build: .
    container_name: greencloud-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      # Inside Docker, PostgreSQL is reached using the
      # service name "postgres", not localhost.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/greencloud

    depends_on:
      postgres:
        condition: service_healthy


# ---------------------------------------------------------
# Persistent PostgreSQL storage
# ---------------------------------------------------------

volumes:
  postgres_data: